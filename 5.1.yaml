commit_metrics:
  red_flags:
    - "Long periods with no commits (stalled project)"
    - "All commits from one person (bottleneck)"
    - "Extremely high commit frequency (possible poor commit hygiene)"
    - "Zero commits from team members (disengagement)"

pull_request_metrics:
  - name: "Merge Rate"
    formula: "(PRs Merged / PRs Created) × 100"
    target: "80-95%"
  - name: "Cycle Time"
    formula: "Average (Merge Date - Creation Date)"
    target: "24-48 hours"
  - name: "Review Comments"
    formula: "Average comments per PR"
    target: "3-8 constructive comments"

pull_request_red_flags:
  - "PRs sitting open for more than 1 week (slow reviews)"
  - "High abandonment rate (unclear requirements)"
  - "PRs merged without reviews (quality risk)"
  - "Excessive back-and-forth (unclear standards)"

optimal_metrics:
  - "<10% of branches older than 1 month"
  - "95%+ build success rate"
  - "0 merges to main without passing tests"
  - "<2 hotfixes per month to production"

repository_metrics:
  - name: "Stale Branch Ratio"
    formula: "(Branches inactive >30 days / Total branches) × 100"
    target: "<10%"
  - name: "Build Success Rate"
    formula: "(Successful builds / Total builds) × 100"
    target: "95%+"
  - name: "Hotfix Frequency"
    formula: "Number of emergency fixes per month"
    target: "0-2 per month"
  - name: "Branch Protection Compliance"
    formula: "Percentage of commits that passed checks"
    target: "100%"

repository_red_flags:
  - "Many stale branches (cleanup needed)"
  - "<90% build success (code quality issues)"
  - ">3 hotfixes per month (systemic problem)"
  - "Merges bypassing protection rules (process violation)"